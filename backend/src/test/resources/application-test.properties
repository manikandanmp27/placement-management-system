spring.application.name=placement-management-system-test

# H2 In-Memory Database Configuration for Automated Testing
spring.datasource.url=jdbc:h2:mem:campus_placement;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS test fallback
cors.allowed-origins=http://localhost:5173
