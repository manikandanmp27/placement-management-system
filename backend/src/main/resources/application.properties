spring.application.name=placement-management-system

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/campus_placement}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Security Configuration
# The JWT secret MUST be explicitly configured via the JWT_SECRET environment variable.
# Application startup will fail fast if JWT_SECRET is missing, blank, or shorter than 256 bits (32 bytes).
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin Bootstrap Configuration
app.bootstrap.admin.email=${ADMIN_INITIAL_EMAIL:}
app.bootstrap.admin.password=${ADMIN_INITIAL_PASSWORD:}

