spring.application.name=placement-management-system

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/campus_placement}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT Security Configuration (Never hardcode production secrets; override via environment variable JWT_SECRET)
jwt.secret=${JWT_SECRET:local-development-secret-key-must-be-at-least-256-bits-long-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
